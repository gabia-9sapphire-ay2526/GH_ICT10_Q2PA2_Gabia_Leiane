<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <title>Set Operators</title>
</head>
<body class="container py-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 500px;">
        <h4 class="mb-3 text-center">Add a new club member</h4>

        <div class="mb-3">
            <input type="text" id="first_name" class="form-control" placeholder="Put ur first name">
        </div>
        <div class="mb-3">
            <input type="text" id="last_name" class="form-control" placeholder="Put ur last name">
        </div>

        <button type="button" class="btn btn-primary w-100 mb-3" py-click="create_order">Submit</button>

        <div id="results"></div>
    </div>

    <py-script src="main.py"></py-script>
</body>
</html>
